name: Copy Files to Another Repo
on:
  push:
    branches: [ main ] # Runs every time you push to the main branch

jobs:
  copy-files:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Repo
        uses: actions/checkout@v4

      - name: Pushes Files to Destination Repo
        uses: dmnemec/copy_file_to_another_repo_action@main
        env:
          API_TOKEN_GITHUB: ${{ secrets.COPY_TOKEN }}
        with:
          source_file: './' # Selects all files and folders in the current directory
          destination_repo: 'Videogamer543/CADAI--Lovable-'
          destination_folder: '/' # Drops them directly into the root folder of the target repo
          user_email: 'jcshuang1109@gmail.com' # Replace with your real GitHub email
          user_name: 'Videogamer543'
          commit_message: 'Automated full repository copy'


