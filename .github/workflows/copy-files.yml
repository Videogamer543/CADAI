name: Copy All Files to Another Repo
on:
  push:
    branches: [ main ]

jobs:
  copy-files:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Repo
        uses: actions/checkout@v4

      - name: Copy and Push to Target Repo
        env:
          API_TOKEN_GITHUB: ${{ secrets.COPY_TOKEN }}
        run: |
          # 1. Setup git credentials
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          
          # 2. Clone the target repository using your exact path
          git clone "https://x-access-token:$API_TOKEN_GITHUB@://github.com" /tmp/target-repo
          
          # 3. Clean out target folder (excluding its hidden .git folder)
          find /tmp/target-repo -maxdepth 1 ! -name '.git' ! -name 'target-repo' -exec rm -rf {} +
          
          # 4. Copy files over (excluding source git metadata)
          rsync -av --exclude='.git' --exclude='.github' ./ /tmp/target-repo/
          
          # 5. Commit and push changes
          cd /tmp/target-repo
          git add -A
          if git diff-index --quiet HEAD --; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Automated full repository sync from CADAI"
          git push origin main

