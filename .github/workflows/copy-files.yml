name: Copy Files to Another Repo
on:
  push:
    branches: [ main ] # Runs every time you push to the main branch

jobs:
  copy-files:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Repo
        uses: actions/checkout@v4

      - name: Pushes Files to Destination Repo
        uses: dmnemec/copy_file_to_another_repo_action@main
        env:
          API_TOKEN_GITHUB: ${{ secrets.COPY_TOKEN }}
        with:
          source_file: '.' # 1. Changing this to '.' selects everything in the repository
          destination_repo: 'Videogamer543/CADAI--Lovable-' # REPLACE with your actual target repo name
          destination_folder: '.' # 2. Changing this to '.' drops everything right into the root folder
          user_email: 'jcshuang1109@gmail.com' # REPLACE with your GitHub email
          user_name: 'Videogamer543'
          commit_message: 'Automated full repository sync'
