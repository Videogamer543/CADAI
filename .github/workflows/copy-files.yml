name: Copy Files to Another Repo
on:
  push:
    branches: [ main ] # Runs every time you push to the main branch

jobs:
  copy-files:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Repo
        uses: actions/checkout@v4

      - name: Pushes Files to Destination Repo
        uses: dmnemec/copy_file_to_another_repo_action@main
        env:
          API_TOKEN_GITHUB: ${{ secrets.COPY_TOKEN }}
        with:
          source_file: 'README.md' # Start by testing with just ONE file to make sure it works!
          destination_repo: 'Videogamer543/CADAI--Lovable-' 
          destination_folder: '/' # Forces it to look at the root directory of the target repo
          user_email: 'jcshuang1109@gmail.com' # Make sure this matches your real email
          user_name: 'Videogamer543'
          commit_message: 'Automated file copy'

