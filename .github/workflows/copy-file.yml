name: Copy Files to Another Repo
on:
  push:
    branches: [ main ] # Runs every time you push to the main branch

jobs:
  copy-files:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Repo
        uses: actions/checkout@v4

      - name: Pushes Files to Destination Repo
        uses: dmnemec/copy_file_to_another_repo_action@main
        env:
          API_TOKEN_GITHUB: ${{ secrets.COPY_TOKEN }} # Your Personal Access Token secret
        with:
          source_file: 'tools/' # Change this to the specific file or folder you want to copy
          destination_repo: 'Videogamer543/your-target-repo' # REPLACE with your target repository path
          destination_folder: 'imported-files' # The folder name inside your target repo
          user_email: 'your-email@example.com' # REPLACE with your GitHub email
          user_name: 'Videogamer543'
          commit_message: 'Automated file copy from CADAI repo'
